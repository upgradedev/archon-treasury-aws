name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Runtime dependencies: none. Stdlib only, so there is no install step.
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Phase gates (A1, A5, B4/G4/F5, C2, 21 rules, integer cents)
        run: python scripts/verify_gates.py --self-test
      - name: Line coverage of the pure core (C1, minimum 85)
        run: python scripts/coverage_check.py 85

  deploy:
    needs: gates
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-west-1
      LAMBDA_FUNCTION: archon-treasury-demo
      LIVE_URL: https://pjlgavqdkhrcserxuqjz6icit40vbfxv.lambda-url.eu-west-1.on.aws/
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package deterministic Lambda zip
        run: python scripts/package_lambda.py
      - name: Configure AWS OIDC role (when AWS_ROLE_TO_ASSUME is set)
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to AWS Lambda and run 31-step live smoke
        if: env.AWS_ROLE_TO_ASSUME != '' || env.AWS_ACCESS_KEY_ID != ''
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --zip-file fileb://temp/archon-lambda.zip \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --environment "Variables={DEPLOYED_SHA=${GITHUB_SHA}}" \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"
          python scripts/smoke_deployed.py "$LIVE_URL"

