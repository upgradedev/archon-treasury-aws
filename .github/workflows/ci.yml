name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-and-architecture-gates:
    name: "Stage 1: Architecture & Hygiene Gates (10/10)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run 10 deterministic hexagonal & hygiene gates + self-test
        run: python scripts/verify_gates.py --self-test

  security-audit:
    name: "Stage 2: DevSecOps Security (SAST, Secrets, IaC, OWASP)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SAST (Python & TS/TSX), Secret Scan, Terraform IaC & OWASP Header Audit
        run: python scripts/security_audit.py

  testing-pyramid-unit:
    name: "Stage 3: Pyramid L1 - Domain Unit Tests & Coverage (${{ matrix.python-version }})"
    needs: [static-and-architecture-gates]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pure Hexagonal Domain Unit Tests (Money, 21 Rules, Approvals, Merkle, Benchmark)
        run: |
          PYTHONPATH=src:tests python -m unittest -v \
            tests/test_money.py \
            tests/test_completeness.py \
            tests/test_approvals.py \
            tests/test_receipts.py \
            tests/test_benchmark.py
      - name: Enforce Line Coverage >= 85% across Core, Demo & Adapters
        run: python scripts/coverage_check.py 85

  testing-pyramid-integration:
    name: "Stage 4: Pyramid L2 - Adapter, Contract & HTTP Integration"
    needs: [testing-pyramid-unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Adapter & Boundary Contract Tests (Airwallex, Socket Stub, Bedrock, Metal x402, Sessions, Lambda)
        run: |
          PYTHONPATH=src:tests python -m unittest -v \
            tests/test_airwallex_adapter.py \
            tests/test_live_transport.py \
            tests/test_bedrock_evaluator.py \
            tests/test_metal_evaluator.py \
            tests/test_sessions.py \
            tests/test_lambda_handler.py \
            tests/test_demo_app.py \
            tests/test_production_gaps.py

  testing-pyramid-e2e-local:
    name: "Stage 5: Pyramid L3 - UAT, Concurrency Race & Local 39-Step E2E"
    needs: [testing-pyramid-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: UAT Journeys, 8-Thread Concurrency Race, Hostile Inputs & A11y Landmarks
        run: PYTHONPATH=src:tests python -m unittest -v tests/test_uat_journeys.py
      - name: Boot Local Ephemeral Server & Execute 39-Step E2E Smoke
        run: |
          PYTHONPATH=src python -m archon_demo.server --port 8765 &
          SERVER_PID=$!
          sleep 1
          python scripts/smoke_deployed.py http://127.0.0.1:8765
          kill $SERVER_PID || true

  frontend-erp-build:
    name: "Stage 6: React + TypeScript + Vite + Tailwind ERP Build"
    needs: [security-audit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Frontend Dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript Strict Check & Vite Production Build
        run: npm run build
      - name: Verify Production Bundle Artifact
        run: test -f dist/index.html
      - name: Verify Deterministic Lambda Packaging Bundles React Frontend
        working-directory: .
        run: |
          python3 scripts/package_lambda.py | grep '"frontend_bundled": true'

  deploy:
    name: "Stage 7: CD Deploy to AWS Lambda & 39-Step Live Production Smoke"
    needs:
      - static-and-architecture-gates
      - security-audit
      - testing-pyramid-unit
      - testing-pyramid-integration
      - testing-pyramid-e2e-local
      - frontend-erp-build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-west-1
      LAMBDA_FUNCTION: archon-treasury-demo
      LIVE_URL: https://pjlgavqdkhrcserxuqjz6icit40vbfxv.lambda-url.eu-west-1.on.aws/
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWX_CLIENT_ID: ${{ secrets.AWX_CLIENT_ID }}
      AWX_API_KEY: ${{ secrets.AWX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Frontend Bundle for Lambda Static Packaging
        run: |
          npm --prefix frontend install --no-audit --no-fund
          npm --prefix frontend run build
      - name: Package deterministic Lambda zip
        run: python scripts/package_lambda.py
      - name: Configure AWS OIDC role (when AWS_ROLE_TO_ASSUME is set)
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to AWS Lambda and run 39-step live production smoke
        if: env.AWS_ROLE_TO_ASSUME != '' || env.AWS_ACCESS_KEY_ID != ''
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --zip-file fileb://temp/archon-lambda.zip \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --environment "Variables={DEPLOYED_SHA=${GITHUB_SHA},ARCHON_ENABLE_LIVE_BEDROCK=1,AWX_CLIENT_ID=${AWX_CLIENT_ID},AWX_API_KEY=${AWX_API_KEY}}" \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"
          python scripts/smoke_deployed.py "$LIVE_URL"
